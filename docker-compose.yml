services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - DB_PATH=/app/data/job_copilot.db
    volumes:
      - data-volume:/app/data
      - ./profile.json:/app/profile.json:ro

volumes:
  data-volume:
